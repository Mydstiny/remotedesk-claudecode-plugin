name: source-checks

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check src/pi-adapter.mjs
      - run: node --check src/pi-events.mjs
      - run: node --check src/pi-runtime.mjs
      - run: node --check src/control-panel.mjs
      - run: node --check bin/remotedesk-pi.mjs
      - run: npm pack --dry-run --ignore-scripts
